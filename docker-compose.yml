services:
  flask:
    build: .
    container_name: weatherApp
    restart: always
    env_file:
      - .env
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static/:/app/static:ro
    depends_on:
      - flask
