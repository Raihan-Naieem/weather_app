<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title> {% block title %} {% endblock %}</title>

  </head>
  <body>
    {% if navbar|default(true) %}
    <nav class="navbar navbar-expand-lg blur border border-white border-opacity-50 rounded-5 mt-2 mx-2">
      <div class="container-fluid">
        <a class="navbar-brand d-inline-block hover-scale" 
           href="{{ url_for('dashboard.index') }}">
          ☁️ Home
        </a>

        <!-- Navbar toggle for small screens -->
        <button 
					class="navbar-toggler"
					type="button" 
					data-bs-toggle="collapse"
					data-bs-target="#mobileNav"
					aria-controls="mobileNav"
					aria-expanded="false"
					aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

				<div class="collapse navbar-collapse" id="mobileNav">
					<ul class="navbar-nav w-100">
						<li class="nav-item">
							<a class="navbar-brand d-inline-block hover-scale" href="{{ url_for('weather.search_city_info') }}">Search City</a>
						</li>
						<li class="nav-item ms-lg-auto">
							<a class="navbar-brand d-inline-block hover-scale" href="{{ url_for('auth.logout') }}">Logout</a>
						</li>
					</ul>
				</div>


      </div>
    </nav>
    {% endif %}

    <div class="position-fixed top-0 start-50 translate-middle-x mt-5 w-100 blur" style="z-index: 1050; max-width: 600px;">
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm mb-2 mx-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endfor %}

    </div>

    {% block body%} {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="{{ url_for('static', filename='script.js') }}"></script>

  </body>
</html>
