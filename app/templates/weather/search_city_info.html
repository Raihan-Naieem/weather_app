{% extends "base.html" %}
{% block title %}
  Search city
{% endblock %}

{% block body %}

<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg w-100 rounded-5 blur" style="max-width: 400px;">
    <div class="card-body text-center p-4">
			<form action="{{ url_for('weather.search_city_info') }}" method="post" class="w-100" style="max-width: 350px;">
				
				<h2 class="text-center mb-4">Search City Info</h2>
				
				<div class="mb-4">
					<input 
						type="text" 
						class="form-control form-control-lg rounded-4 text-center w-75 mx-auto blur"
						id="city" 
						name="city"
						placeholder="Enter city"
						value="{{ request.form.get('city', '') }}"
						list="city-list"
						autocomplete="off"
						required>

					<datalist id="city-list">
					{% for city in cities %}
						<option value="{{ city }}">
					{% endfor %}
					</datalist>
					
				</div>
				
				<div class="d-flex justify-content-center ">
						<button type="submit" class="btn btn-outline-primary py-2 px-4 rounded-4">Search</button>
				</div>
				
			</form>
    </div>
  </div>
</div>

{% endblock %}
